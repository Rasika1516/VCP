# =============================================================================
# VCP Data Plane — Docker Compose (development / integration testing)
# =============================================================================
# Services:
#   redis       — Redis 7, command bus + state cache + trace streams
#   worker-ac   — VCP worker for 100 AC chargers (OCPP 1.6J)
#   worker-dc   — VCP worker for 20 DC fast chargers (OCPP 2.0.1)
#
# Optional (profile: tools):
#   redisinsight — Redis GUI (http://localhost:8001)
#
# Usage:
#   docker compose up                          # start core services
#   docker compose --profile tools up          # + RedisInsight
#   docker compose up worker-ac --scale 3      # 3 AC workers (adjust sharding)
# =============================================================================

version: "3.9"

# Fixed project name so container names don't depend on the folder name.
name: vcp_data_plane

# ---------------------------------------------------------------------------
# Shared environment defaults
# ---------------------------------------------------------------------------
x-worker-env: &worker-env
  REDIS_HOST: vcp-cp-redis
  REDIS_PASSWORD: ""
  CONTROL_API_TOKEN: ""
  PYTHONUNBUFFERED: "1"

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── AC Worker (OCPP 1.6J, 100 VCPs) ───────────────────────────────────────
  worker-ac:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vcp-data-plane:latest
    restart: unless-stopped
    environment:
      <<: *worker-env
    volumes:
      # Mount a custom worker config; falls back to embedded example
      - ./configs/worker-ac.yaml:/app/configs/worker.yaml:ro
      - ./configs/profiles:/app/configs/profiles:ro
    ports:
      - "18080:8080"   # Control API
      - "19090:9090"   # Prometheus metrics
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - control-plane

  # ── DC Worker (OCPP 2.0.1, 20 VCPs) ───────────────────────────────────────
  worker-dc:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vcp-data-plane:latest
    restart: unless-stopped
    environment:
      <<: *worker-env
    volumes:
      - ./configs/worker-dc.yaml:/app/configs/worker.yaml:ro
      - ./configs/profiles:/app/configs/profiles:ro
    ports:
      - "18081:8080"   # Control API
      - "19091:9090"   # Prometheus metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - control-plane

  # ── RedisInsight (optional, profile: tools) ────────────────────────────────
  redisinsight:
    image: redislabs/redisinsight:latest
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - redisinsight_data:/db
    networks:
      - control-plane

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  redis_data:
  redisinsight_data:

networks:
  control-plane:
    external: true
    name: vcp_control_plane_default
