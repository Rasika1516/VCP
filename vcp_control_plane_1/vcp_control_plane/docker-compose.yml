version: "3.9"

# Fixed project name: keeps the network "vcp_control_plane_default" (used by the
# data plane workers) the same no matter which folder this repo is copied into.
name: vcp_control_plane

# =============================================================================
# VCP Fleet Simulator — Control & Management Plane
# Stack: PostgreSQL + Redis + Backend API + Frontend dev server
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — VCP Registry
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: vcp-cp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vcp
      POSTGRES_PASSWORD: vcp_secret
      POSTGRES_DB: vcp_registry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcp -d vcp_registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Command Bus & Event Streams
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vcp-cp-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend — FastAPI Control Plane
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: vcp-cp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VCP_CP_API_HOST: "0.0.0.0"
      VCP_CP_API_PORT: "8000"
      VCP_CP_API_TOKEN: "dev-token-change-me"
      VCP_CP_REQUIRE_AUTH: "true"
      VCP_CP_DATABASE_URL: "postgresql+asyncpg://vcp:vcp_secret@postgres:5432/vcp_registry"
      VCP_CP_REDIS_HOST: redis
      VCP_CP_REDIS_PORT: "6379"
      VCP_CP_REDIS_SSL: "false"
      VCP_CP_REDIS_DB: "0"
      VCP_CP_COMMAND_STREAM_PREFIX: "vcp:commands:worker"
      VCP_CP_BROADCAST_STREAM: "vcp:commands:broadcast"
      VCP_CP_EVENT_STREAM_PREFIX: "vcp:events:worker"
      VCP_CP_CONSUMER_GROUP: "cp-group"
      VCP_CP_CONSUMER_NAME: "cp-consumer-1"
      # RNZ (2026-10-09): Was VCP_CP_WORKER_URLS_RAW: "" - wrong name (settings.py reads
      # VCP_CP_WORKER_URLS) and empty, so the backend knew of 0 workers.
      # Comma-separated data-plane worker URLs. host.docker.internal = the Windows host,
      # where vcp-worker runs on :8080 ("localhost" would be the container itself).
      # VCP_CP_WORKER_URLS: "http://host.docker.internal:8080"
      # Data plane worker control APIs (same Docker network); drives the Workers count
      VCP_CP_WORKER_URLS: "http://worker-ac:8080,http://worker-dc:8080"
      VCP_CP_WORKER_TOKEN: ""
      VCP_CP_FRONTEND_URL: "http://localhost:5173"
      VCP_CP_LOG_LEVEL: "info"
      VCP_CP_PROFILE_DIR: "/app/profiles"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src       # Live code reload in dev
      - ./profiles:/app/profiles

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite dev server
  # ---------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: vcp-cp-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api/v1"
      VITE_WS_BASE_URL: "ws://localhost:8000/api/v1"
      VITE_API_TOKEN: "dev-token-change-me"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules     # Anonymous volume to preserve container node_modules

volumes:
  postgres_data:
  redis_data:
