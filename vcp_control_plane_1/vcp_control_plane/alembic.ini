[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Use VCP_CP_DATABASE_URL env var at runtime (see alembic/env.py)
# RNZ (2026-10-09): Was vcp:vcp@localhost:5432/vcp_control. Changed to match the Docker
# Postgres in docker-compose.yml (user vcp / vcp_secret, db vcp_registry). 127.0.0.1 is
# used because "localhost" can resolve to ::1, where a WSL Postgres also listens.
# Alembic reads this file, not .env, unless VCP_CP_DATABASE_URL is set.
; sqlalchemy.url = postgresql+asyncpg://vcp:vcp_secret@127.0.0.1:5432/vcp_registry

sqlalchemy.url = postgresql+asyncpg://vcp:vcp_secret@127.0.0.1:5433/vcp_registry
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
